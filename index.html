<!DOCTYPE html>
<html lang="id">
<head>

<title>SI LEMBUR YONASINDO</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#a8c8a2;--pine:#1c4430;--pine2:#2b5d43;--card:#f6f9f3;--ink:#1b2a21;--mute:#5d6f62;--line:#d5e0d0;--wait:#b7791f;--ok:#2f7d4f;--no:#b23b3b;--r:10px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--pine)}
.l-left{padding:56px;display:flex;flex-direction:column;justify-content:space-between;color:#e4efdf;background:var(--pine)}
.l-left h1{font-size:clamp(34px,4.6vw,58px);line-height:1.02;font-weight:700;letter-spacing:-.02em;max-width:9em}
.l-left p{max-width:30em;color:#b5ccb8}
.l-left small{color:#8fae95}
.l-right{background:var(--bg);display:grid;place-items:center;padding:28px}
.box{background:var(--card);padding:30px;border-radius:var(--r);width:100%;max-width:380px;border:1px solid var(--line)}
.box h2{font-size:20px;margin-bottom:4px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #b9c9b4;border-radius:7px;background:#fff}
textarea{min-height:76px;resize:vertical}
.btn{border:0;background:var(--pine);color:#fff;padding:10px 16px;border-radius:7px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine2)}
.btn.full{width:100%;margin-top:20px}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.btn.ghost:hover{background:#e5eee1}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.demo{margin-top:18px;font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:12px}
.demo code{background:#e8f0e4;padding:1px 5px;border-radius:4px}
.err{color:var(--no);font-size:13px;margin-top:10px;min-height:18px}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--pine);color:#d6e6d3;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.brand{font-weight:700;font-size:17px;line-height:1.15;padding:0 8px 18px;border-bottom:1px solid #ffffff22;margin-bottom:14px;color:#fff}
.brand span{display:block;font-weight:500;font-size:12px;color:#9dbba2;margin-top:3px}
nav a{display:block;padding:9px 12px;border-radius:7px;color:#cfe0cc;text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a:hover{background:#ffffff14}
nav a.on{background:var(--bg);color:var(--pine);font-weight:600}
.me{margin-top:auto;padding:14px 8px 0;border-top:1px solid #ffffff22;font-size:13px}
.me b{display:block;color:#fff}
.me button{margin-top:10px;width:100%}
.me .btn.ghost{color:#d6e6d3;border-color:#ffffff55}
main{padding:28px 32px 48px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h2{font-size:24px;letter-spacing:-.01em}
.top .sub{color:#2d4a37;font-size:14px}
#burger{display:none;background:var(--pine);color:#fff;border:0;border-radius:7px;padding:8px 11px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--r);padding:16px;border-left:5px solid var(--pine2)}
.stat.w{border-color:var(--wait)}.stat.n{border-color:var(--no)}
.stat div{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{width:auto;min-width:150px}
.bar .grow{flex:1}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.tag.Menunggu{background:#f6e8c8;color:#7a4e0c}.tag.Disetujui{background:#cfe8d6;color:#1d5a36}.tag.Ditolak{background:#f2d4d4;color:#8a2b2b}
.tag.admin{background:#1c4430;color:#fff}.tag.kadiv{background:#d9c47a;color:#4a3a05}.tag.karyawan{background:#dbe6d6;color:#2b4a35}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:26px;text-align:center;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.note{font-size:13px;color:var(--mute);margin-top:6px}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hbar i{display:block;height:14px;background:var(--pine2);border-radius:3px;min-width:3px}
.hbar b{width:92px;font-weight:500}
/* modal & toast */
#mod{position:fixed;inset:0;background:#10241a99;display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--card);border-radius:var(--r);padding:24px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
.mbox h3{margin-bottom:4px;font-size:18px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;padding:10px 18px;border-radius:8px;z-index:30;font-size:14px}
@media(max-width:860px){
 #login{grid-template-columns:1fr}.l-left{padding:28px;gap:30px}
 #app{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:15;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}
 #burger{display:block}
 main{padding:16px 14px 40px}.top h2{font-size:20px}
 .grid2{grid-template-columns:1fr}
 table.rs thead{display:none}
 table.rs tr{display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 4px;background:#fff}
 table.rs td{display:flex;justify-content:space-between;gap:14px;border:0;padding:5px 10px;text-align:right}
 table.rs td::before{content:attr(data-l);font-weight:600;color:var(--mute);text-align:left;flex:none}
 .bar input,.bar select{flex:1;min-width:120px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

nav a em,.ct em{font-style:normal;background:var(--wait);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
.tsel{display:flex;align-items:center;gap:6px}.tsel select{width:auto;flex:1}
.prev img{max-width:180px;border-radius:8px;margin-top:8px;display:block}
.mbox img{width:100%;border-radius:8px}
.chat{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 150px);min-height:440px;background:var(--card);border-radius:var(--r);overflow:hidden}
.clist{border-right:1px solid var(--line);padding:12px;overflow:auto}
.ct{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;margin-top:4px}
.ct:hover{background:#e8f0e4}.ct.on{background:#d4e4cf}.ct small{display:block;color:var(--mute);font-size:12px}
.cconv{display:flex;flex-direction:column;min-height:0}
.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.cback{display:none}
#cm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:#eaf1e6}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;background:#fff;align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--pine2);color:#fff}.msg small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
@media(max-width:860px){.chat{grid-template-columns:1fr;height:calc(100vh - 120px)}.chat .cconv{display:none}.chat.open .cconv{display:flex}.chat.open .clist{display:none}.cback{display:block}}
#ov{display:none;position:fixed;inset:0;background:#10241a99;z-index:14}#ov.show{display:block}
aside .x{display:none;background:#ffffff1f;color:#fff;border:0;border-radius:7px;padding:9px 12px;margin-bottom:12px;font-weight:600;cursor:pointer;width:100%;text-align:left}
nav a.out{margin-top:10px;border-top:1px solid #ffffff22;border-radius:0 0 7px 7px;padding-top:12px}
@media(max-width:860px){aside{height:100dvh;overflow-y:auto}aside .x{display:block}}

.pw{position:relative}.pw input{padding-right:84px}.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:#e5eee1;color:var(--pine);border:0;border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.hero{background:var(--pine);color:#e4efdf;border-radius:var(--r);padding:22px 26px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.hi{color:#b5ccb8;font-size:15px}.clk{font-size:clamp(36px,7vw,54px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;color:#fff}.dt{color:#cfe0cc;margin-top:2px}
.hq{display:flex;gap:8px;flex-wrap:wrap}.hero .btn{background:#e8f0e4;color:var(--pine)}.hero .btn.light{background:transparent;color:#fff;border:1px solid #ffffff66}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.lnk{color:var(--pine2);font-weight:600;font-size:13px;cursor:pointer}
.an{padding:10px 0;border-bottom:1px solid var(--line)}.an:last-child{border:0}.an.big{padding:16px 0}.an p{white-space:pre-wrap;margin-top:8px;word-break:break-word}
.cols{display:flex;gap:10px;align-items:flex-end;height:160px}.cols>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:12px}
.cols i{display:block;width:100%;max-width:46px;background:var(--pine2);border-radius:4px 4px 0 0;min-height:3px}.cols b{margin-bottom:3px}.cols span{color:var(--mute);margin-top:5px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}.tabs a{padding:8px 18px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}.tabs a.on{color:var(--pine);border-color:var(--pine)}
.tk{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.tk:last-child{border:0}.tk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--pine2)}
.tk.done b{text-decoration:line-through;color:var(--mute)}.grow{flex:1;min-width:0}.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12.5px;color:var(--mute)}.late{color:var(--no);font-weight:600}
.tag.PRendah{background:#dbe6d6;color:#2b4a35}.tag.PSedang{background:#f6e8c8;color:#7a4e0c}.tag.PTinggi{background:#f2d4d4;color:#8a2b2b}
.memos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.memo{background:#fffdf3;border:1px solid #e6dfb8;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}.memo p{white-space:pre-wrap;font-size:14px;flex:1;word-break:break-word}
.chat{display:grid;grid-template-columns:300px 1fr;height:min(640px,calc(100dvh - 160px));min-height:380px;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.clist{border-right:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:2px}.clist input{margin-bottom:8px}
.ct{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;margin:0}
.ctx{flex:1;min-width:0}.ctx b{display:block;font-size:14px}.ctx small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.c0{background:#2b5d43}.c1{background:#8a6d2b}.c2{background:#3f7a6a}.c3{background:#7a5a3a}.c4{background:#4f6b2c}
.cconv{display:flex;flex-direction:column;min-height:0;background:#eaf1e6}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}.chead small{display:block;color:var(--mute);font-size:12px}
#cm{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:5px}#cm>:first-child{margin-top:auto}
.msg{max-width:78%;padding:7px 12px 5px;border-radius:14px 14px 14px 4px;background:#fff;align-self:flex-start;word-break:break-word;box-shadow:0 1px 0 #0001}
.msg.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--pine2);color:#fff}.msg small{display:block;text-align:right;font-size:10.5px;opacity:.65;margin-top:1px}
.dsep{text-align:center;margin:8px 0 4px}.dsep span{background:#d4e4cf;color:var(--mute);font-size:11.5px;padding:2px 10px;border-radius:99px}
.cempty{margin:auto;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:4px;padding:20px}.cempty b{color:var(--ink)}
.cform{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}.cform input{border-radius:99px;padding:10px 16px}.cform .btn{border-radius:99px;padding:10px 22px}
@media(max-width:860px){.g2{grid-template-columns:1fr}.hero{padding:18px}.chat{grid-template-columns:1fr;height:calc(100dvh - 120px)}.chat .cconv{display:none}.chat.open .cconv{display:flex}.chat.open .clist{display:none}.cback{display:block}.msg{max-width:86%}}
</style>
</head>
<body>
<script>if(top!==self){document.documentElement.innerHTML=""}</script>

<section id="login">
 <div class="l-left">
  <div><small>PT Yonasindo</small></div>
  <div><h1>SI LEMBUR YONASINDO</h1><p style="margin-top:16px">Catat jam lembur, setujui per divisi, dan rekap biaya lembur dalam satu tempat.</p></div>
  <small>Sistem Informasi Lembur Karyawan</small>
 </div>
 <div class="l-right"><form class="box" onsubmit="return doLogin(event)">
  <h2>Masuk</h2><div class="note">Gunakan akun yang diberikan admin.</div>
  <label for="u">Username</label><input id="u" autocomplete="username" required>
  <label for="p">Kata sandi</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" class="eye" onclick="togglePw('p',this)">Lihat</button></div>
  <div class="err" id="lerr"></div>
  <button class="btn full">Masuk</button>
  <div class="demo">Lupa kata sandi? Hubungi admin. Sesi berakhir otomatis jika tidak aktif 30 menit.</div>
 </form></div>
</section>

<div id="app" class="hide">
 <aside id="side">
  <button class="x" onclick="menu(false)" aria-label="Tutup menu">✕ Tutup</button><div class="brand">SI LEMBUR<br>YONASINDO<span id="role"></span></div>
  <nav id="nav"></nav>
  <div class="me"><b id="mn"></b><span id="md"></span></div>
 </aside>
 <main>
  <div class="top"><button id="burger" onclick="menu(true)" aria-label="Menu">☰</button>
   <div><h2 id="title"></h2><div class="sub" id="sub"></div></div></div>
  <div id="view"></div>
 </main>
</div>
<div id="ov" onclick="menu(false)"></div>
<div id="mod" class="hide" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>

<script>
/* Alamat server diisi di file config.js (cukup sekali, tidak ikut berubah saat aplikasi diperbarui) */
const API_URL=(window.APP_CONFIG&&window.APP_CONFIG.API_URL)||'';
const WIB={timeZone:'Asia/Jakarta'};
const today=()=>new Date().toLocaleDateString('en-CA',WIB);
const wkt=t=>new Date(t).toLocaleDateString('id-ID',{...WIB,day:'numeric',month:'short',year:'numeric'});
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{...WIB,hour:'2-digit',minute:'2-digit',hour12:false});

const $=(s)=>document.querySelector(s);
const tgl=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const bln=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB,ME,PAGE,PEER=null;

/* Divisi & kelompok persetujuan: satu kepala divisi menyetujui satu kelompok */
const GRUP=[['IT','Satpam','Akunting','Operasional'],['Dokumen','PIC','Perekrutan','Sensei']];
const DIVS=GRUP.flat();
const grupOf=d=>GRUP.find(g=>g.includes(d))||[];







function toast(m){const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}

/* ---------- login ---------- */
async function doLogin(e){e.preventDefault();const er=$('#lerr');
 if(!API_URL){er.textContent='Aplikasi belum dihubungkan ke server (API_URL kosong).';return false}
 er.textContent='Memeriksa…';
 const x=await api('login',{username:$('#u').value.trim(),password:$('#p').value});
 if(!x.ok){er.textContent=x.error||'Gagal masuk.';return false}
 TOKEN=x.token;sessionStorage.setItem('yonas_t',TOKEN);const m=await refresh();
 if(m){er.textContent=m;return false}er.textContent='';$('#p').value='';idle=Date.now();start();return false}
async function logout(){try{if(TOKEN)await Promise.race([api('logout'),new Promise(r=>setTimeout(r,800))])}catch(e){}TOKEN='';sessionStorage.removeItem('yonas_t');location.reload()}
async function init(){if(!TOKEN||!API_URL)return;const m=await refresh();if(m){TOKEN='';sessionStorage.removeItem('yonas_t');return}start()}
let TOKEN=sessionStorage.getItem('yonas_t')||'',idle=Date.now();
['click','keydown','touchstart'].forEach(v=>document.addEventListener(v,()=>idle=Date.now(),{passive:true}));
async function api(action,p={}){let t;
 try{t=await (await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...p,action,token:TOKEN})})).text()}catch(e){return{ok:false,error:'Tidak bisa menghubungi server. Periksa koneksi internet dan API_URL.'}}
 let x;try{x=JSON.parse(t)}catch(e){return{ok:false,error:'Server tidak mengembalikan data. Pastikan URL berakhiran /exec dan akses deployment "Anyone".'}}
 if(x.auth&&ME){ME=null;toast('Sesi berakhir, silakan login ulang');setTimeout(logout,1200)}return x}
async function refresh(){const x=await api('data');if(!x.ok)return x.error||'Gagal memuat data.';x.pengumuman=x.pengumuman||[];x.catatan=x.catatan||[];DB=x;ME=x.me;return ''}
async function act(action,p,msg){const x=await api(action,p);if(!x.ok){toast(x.error||'Gagal');return false}const m=await refresh();if(m){toast(m);return false}if(msg)toast(msg);return true}
const RL={admin:'Administrator',kadiv:'Kepala Divisi',karyawan:'Karyawan'};
const MENU={
 admin:[['dash','Dashboard'],['info','Pengumuman'],['lembur','Semua Lembur'],['users','Kelola User'],['divisi','Divisi & Persetujuan'],['laporan','Rekap Jam Lembur'],['catatan','Catatan Kerja'],['chat','Chat'],['set','Pengaturan'],['profil','Profil Saya']],
 kadiv:[['dash','Dashboard'],['info','Pengumuman'],['approve','Persetujuan Lembur'],['riwayat','Riwayat Lembur'],['tim','Rekap Jam Pegawai'],['catatan','Catatan Kerja'],['chat','Chat'],['profil','Profil Saya']],
 karyawan:[['dash','Dashboard'],['info','Pengumuman'],['ajukan','Ajukan Lembur'],['saya','Riwayat Lembur'],['catatan','Catatan Kerja'],['chat','Chat'],['profil','Profil Saya']]};
function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');
 $('#role').textContent=RL[ME.role]+(ME.role!=='admin'?' · '+ME.divisi:'');
 $('#mn').textContent=ME.nama;$('#md').textContent='@'+ME.username;go('dash')}
const navHtml=p=>MENU[ME.role].map(m=>`<a class="${m[0]===p?'on':''}" onclick="go('${m[0]}')">${m[1]}${m[0]==='chat'&&unread()?`<em>${unread()}</em>`:''}</a>`).join('')+'<a class="out" onclick="logout()">Keluar</a>';

 <div><label>Divisi</label><select id="fv">${opt(['-',...DIVS],u.divisi)}</select></div>
 <div><label>Tahun masuk</label><input id="fy" type="number" min="1990" max="2100" value="${u.masuk||''}"></div>
 <div><label>Tanggal lahir</label><input id="fl" type="date" value="${u.lahir||''}"></div><div><label>No. HP</label><input id="fh" type="tel" value="${esc(u.hp)}"></div></div>
 <label>Email</label><input id="fe" type="email" value="${esc(u.email)}">
 <div class="mact"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Simpan user</button></div></form>`)}
async function saveU(e,id){e.preventDefault();
 const o={id,nama:$('#fn').value.trim(),username:$('#fu').value.trim(),password:$('#fp').value,role:$('#fr').value,divisi:$('#fv').value,masuk:$('#fy').value,lahir:$('#fl').value,hp:$('#fh').value.trim(),email:$('#fe').value.trim()};
 if(await act('saveUser',o,'User disimpan')){closeM();go('users')}return false}
async function delU(id){if(!confirm('Hapus user ini beserta data lemburnya?'))return;if(await act('deleteUser',{id},'User dihapus'))go('users')}
async function saveSet(e){e.preventDefault();await act('saveSettings',{maxJam:$('#sm').value},'Pengaturan disimpan');return false}
async function saveProfil(e){e.preventDefault();await act('saveProfil',{lahir:$('#pl').value,email:$('#pe').value.trim(),hp:$('#ph').value.trim()},'Profil disimpan');return false}

/* ---------- jam, sapaan, grafik ---------- */
function clock(){const c=$('#clk');if(!c)return;const n=new Date();c.textContent=n.toLocaleTimeString('en-GB',{...WIB,hour12:false});$('#dt').textContent=n.toLocaleDateString('id-ID',{...WIB,weekday:'long',day:'numeric',month:'long',year:'numeric'})}
setInterval(clock,1000);
const sapa=()=>{const h=parseInt(new Date().toLocaleString('en-GB',{...WIB,hour:'2-digit',hour12:false}),10);return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'};
function mini6(){const a=scope().filter(l=>l.status==='Disetujui'),ms=[];
 for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
 const v=ms.map(m=>sum(a.filter(l=>l.tgl.slice(0,7)===m))),mx=Math.max(1,...v);
 return`<div class="cols">${ms.map((m,i)=>`<div><b>${v[i]}</b><i style="height:${Math.round(v[i]/mx*100)}px"></i><span>${new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'short'})}</span></div>`).join('')}</div>`}
function togglePw(id,b){const i=$('#'+id),s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Sembunyi':'Lihat'}

/* ---------- pengumuman ---------- */
const tgtL=t=>t==='semua'?'Semua karyawan':'Kelompok '+t.slice(1)+' ('+(GRUP[+t.slice(1)-1]||[]).join(', ')+')';
function infoForm(){openM(`<h3>Buat pengumuman</h3><form onsubmit="return saveInfo(event)">
 <label for="ij">Judul</label><input id="ij" maxlength="80" required>
 <label for="ii">Isi pengumuman</label><textarea id="ii" maxlength="1500" required style="min-height:120px"></textarea>
 ${ME.role==='admin'?`<label for="it">Ditujukan untuk</label><select id="it"><option value="semua">Semua karyawan</option><option value="k1">Kelompok 1 (${GRUP[0].join(', ')})</option><option value="k2">Kelompok 2 (${GRUP[1].join(', ')})</option></select>`:`<div class="note">Pengumuman ini dikirim ke seluruh pegawai divisi: ${esc(grupOf(ME.divisi).join(', '))}.</div>`}
 <div class="mact"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Terbitkan</button></div></form>`)}
async function saveInfo(e){e.preventDefault();if(await act('addPengumuman',{judul:$('#ij').value.trim(),isi:$('#ii').value.trim(),target:ME.role==='admin'?$('#it').value:''},'Pengumuman terbit')){closeM();go('info')}return false}
async function delInfo(id){if(!confirm('Hapus pengumuman ini?'))return;if(await act('delPengumuman',{id},'Pengumuman dihapus'))go('info')}

/* ---------- catatan kerja ---------- */
let CT='tugas';
const cmpT=(a,b)=>(a.tenggat||'9')<(b.tenggat||'9')?-1:(a.tenggat||'9')>(b.tenggat||'9')?1:0;
function catFill(){const q=($('#cqq')?.value||'').toLowerCase(),st=$('#cqs')?.value||'',t=today(),box=$('#cat');if(!box)return;
 let a=DB.catatan.filter(c=>c.tipe===CT&&(!q||(c.judul+' '+c.isi).toLowerCase().includes(q)));
 if(CT==='tugas'){if(st==='open')a=a.filter(c=>c.status!=='Selesai');if(st==='done')a=a.filter(c=>c.status==='Selesai');a.sort((x,y)=>(x.status==='Selesai')-(y.status==='Selesai')||cmpT(x,y))}else a.sort((x,y)=>y.ts-x.ts);
 const ac=c=>`<div class="acts"><button class="btn sm ghost" onclick="catForm(${c.id})">Ubah</button><button class="btn sm ghost" onclick="delCat(${c.id})">Hapus</button></div>`;
 if(!a.length){box.innerHTML=`<div class="empty">${CT==='tugas'?'Belum ada tugas. Catat pekerjaan yang harus diselesaikan.':'Belum ada memo. Tulis catatan singkat pekerjaan Anda.'}</div>`;return}
 box.innerHTML=CT==='tugas'?a.map(c=>{const dn=c.status==='Selesai',late=c.tenggat&&c.tenggat<t&&!dn;
  return`<div class="tk ${dn?'done':''}"><input type="checkbox" ${dn?'checked':''} onchange="togCat(${c.id})" aria-label="Tandai selesai"><div class="grow"><b>${esc(c.judul)}</b>${c.isi?`<div class="note">${esc(c.isi)}</div>`:''}<div class="meta"><span class="tag P${c.prioritas}">${c.prioritas}</span>${c.status==='Proses'?'<span class="tag Menunggu">Proses</span>':''}${c.tenggat?`<span class="${late?'late':''}">Tenggat ${tgl(c.tenggat)}${late?' (terlambat)':''}</span>`:''}</div></div>${ac(c)}</div>`}).join('')
  :`<div class="memos">${a.map(c=>`<div class="memo"><b>${esc(c.judul)}</b><p>${esc(c.isi)}</p><div class="note">${wkt(c.ts)}</div>${ac(c)}</div>`).join('')}</div>`}
function catForm(id){const c=DB.catatan.find(x=>x.id===id)||{judul:'',isi:'',prioritas:'Sedang',tenggat:'',status:'Baru'},tg=CT==='tugas';
 openM(`<h3>${id?'Ubah':'Tambah'} ${CT}</h3><form onsubmit="return saveCat(event,${id})">
 <label for="cj">Judul</label><input id="cj" maxlength="80" value="${esc(c.judul)}" required>
 <label for="ci">${tg?'Keterangan (opsional)':'Isi memo'}</label><textarea id="ci" maxlength="2000" ${tg?'':'required'} style="min-height:${tg?76:140}px">${esc(c.isi)}</textarea>
 ${tg?`<div class="grid2"><div><label for="cp">Prioritas</label><select id="cp">${opt(['Rendah','Sedang','Tinggi'],c.prioritas)}</select></div><div><label for="cs">Status</label><select id="cs">${opt(['Baru','Proses','Selesai'],c.status)}</select></div></div><label for="cd">Tenggat (opsional)</label><input type="date" id="cd" value="${c.tenggat||''}">`:''}
 <div class="mact"><button type="button" class="btn ghost" onclick="closeM()">Batal</button><button class="btn">Simpan</button></div></form>`)}
async function saveCat(e,id){e.preventDefault();const tg=CT==='tugas';
 if(await act('saveCatatan',{id,tipe:CT,judul:$('#cj').value.trim(),isi:$('#ci').value.trim(),prioritas:tg?$('#cp').value:'Sedang',status:tg?$('#cs').value:'Baru',tenggat:tg?$('#cd').value:''},'Catatan disimpan')){closeM();catFill()}return false}
async function togCat(id){const c=DB.catatan.find(x=>x.id===id);if(!c)return;await act('saveCatatan',{...c,status:c.status==='Selesai'?'Baru':'Selesai'});catFill()}
async function delCat(id){if(!confirm('Hapus catatan ini?'))return;if(await act('delCatatan',{id},'Catatan dihapus'))catFill()}
init();
</script>
